name: Security Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest bandit requests

      - name: Run Bandit
        run: |
          bandit app.py --skip B404,B603

      - name: Run Pytest
        run: |
          pytest tests/test_security.py
